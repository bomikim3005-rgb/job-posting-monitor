# Every-6-hours pipeline: Adzuna -> BigQuery raw table -> dbt build in BigQuery.
#
# Repo secrets needed (Settings -> Secrets and variables -> Actions):
#   ADZUNA_APP_ID, ADZUNA_APP_KEY  Adzuna API credentials
#   GCP_SA_KEY                     full contents of the service account JSON key
#   BQ_PROJECT                     Google Cloud project ID
name: pipeline

on:
  schedule:
    # 00:17, 06:17, 12:17, 18:17 UTC = 4:17 / 10:17 / 16:17 / 22:17 Pacific (PST).
    # GitHub may start it a few minutes late.
    - cron: "17 */6 * * *"
  workflow_dispatch:        # "Run workflow" button for manual runs

concurrency:
  group: pipeline           # never two runs at once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      BQ_PROJECT: ${{ secrets.BQ_PROJECT }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/../gcp-key.json
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: pip install -r pipeline/requirements.txt

      - name: Write service account key
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        # Written outside the checkout so it can never be committed; the runner is
        # destroyed after the job.
        run: printf '%s' "$GCP_SA_KEY" > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Ingest (Adzuna -> BigQuery)
        run: python pipeline/ingest.py --bigquery

      - name: dbt build (BigQuery)
        working-directory: job_market
        run: dbt build --target bigquery
